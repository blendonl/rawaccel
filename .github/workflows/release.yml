name: release

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2025-vs2026
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: microsoft/setup-msbuild@v3
        with:
          vs-version: "[18.0,)"

      - name: Pick the version
        id: version
        shell: bash
        run: |
          version=$(./tools/next-version.sh)
          ./tools/set-version.sh "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build
        run: >-
          msbuild rawaccel.sln
          "-t:wrapper-deps;wrapper;grapher;writer;wrapper-tests;grapher-tests"
          -p:Configuration=Release -p:Platform=x64
          -restore -m -nologo -v:m

      - name: Test
        run: |
          dotnet test wrapper-tests/wrapper-tests.csproj --no-build -c Release -p:Platform=x64
          dotnet test grapher-tests/grapher-tests.csproj --no-build -c Release -p:Platform=x64

      - name: Package
        shell: pwsh
        run: ./tools/package.ps1

      - name: Install and uninstall the package
        shell: powershell
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          $dir = Join-Path $env:RUNNER_TEMP 'rawaccel'
          $exe = Join-Path $dir 'rawaccel.exe'
          $shortcut = Join-Path ([Environment]::GetFolderPath('Programs')) 'Raw Accel.lnk'
          $entry = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\RawAccel'

          ./install.ps1 -Package "dist/rawaccel-$env:VERSION-win64.zip" -InstallDir $dir -SkipDriver
          if ((Get-Item $exe).VersionInfo.ProductVersion -ne $env:VERSION) { throw 'rawaccel.exe does not report the release version' }
          if (-not (Test-Path (Join-Path $dir 'uninstall.ps1'))) { throw 'uninstall.ps1 was not installed' }
          if (-not (Test-Path $shortcut)) { throw 'no Start menu shortcut' }
          if ((Get-ItemProperty $entry).DisplayVersion -ne $env:VERSION) { throw 'the Apps entry has the wrong version' }

          & (Join-Path $dir 'uninstall.ps1') -KeepDriver
          if (Test-Path $dir) { throw 'the install folder is still there' }
          if (Test-Path $shortcut) { throw 'the Start menu shortcut is still there' }
          if (Test-Path $entry) { throw 'the Apps entry is still there' }

      - uses: actions/upload-artifact@v7
        with:
          name: rawaccel-win64
          path: dist/*.zip

  release:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency: release
    env:
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - name: Look for an unreleased version
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v$VERSION" > /dev/null 2> "$RUNNER_TEMP/release-view.txt"; then
            echo "v$VERSION is already released, nothing to do"
          elif grep -q 'release not found' "$RUNNER_TEMP/release-view.txt"; then
            echo "unreleased=true" >> "$GITHUB_OUTPUT"
          else
            cat "$RUNNER_TEMP/release-view.txt" >&2
            exit 1
          fi

      - uses: actions/download-artifact@v8
        if: steps.release.outputs.unreleased == 'true'
        with:
          name: rawaccel-win64
          path: dist

      - name: Commit and tag the version
        if: steps.release.outputs.unreleased == 'true'
        run: |
          ./tools/set-version.sh "$VERSION"
          if ! git diff --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -am "chore(release): $VERSION"
          fi
          git tag -f "v$VERSION"
          git push --atomic origin HEAD:master "+refs/tags/v$VERSION:refs/tags/v$VERSION"

      - name: Publish the release
        if: steps.release.outputs.unreleased == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$VERSION" "dist/rawaccel-$VERSION-win64.zip" \
            --verify-tag \
            --title "Raw Accel $VERSION" \
            --generate-notes
